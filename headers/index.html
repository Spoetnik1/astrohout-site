<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AstroHout Headers</title>
<style>
  :root { --bg:#1A1714; --fg:#F7F7F5; --accent:#C8560A; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--fg); font:14px/1.4 system-ui, sans-serif; }
  .variant { padding:24px 16px 40px; }
  .label { display:flex; gap:12px; align-items:baseline; margin-bottom:10px; }
  .label b { color:var(--accent); font-size:20px; }
  .label a { color:var(--fg); opacity:.6; margin-left:auto; }
  iframe { width:100%; height:90vh; border:0; background:#fff; display:block; }
</style>
</head>
<body>
<!-- One entry per variant: [number, file, name] -->
<script>
  const variants = [
    ["9",  "09-workbench.html",     "Workbench top-down"],
    ["11", "11-measuring-tape.html","Measuring tape"],
    ["19", "19-nasa-standards.html","NASA graphics standards"],
    ["2",  "02-shop-drawing.html",  "Cut list / shop drawing"],
    ["25", "25-brutalist.html",     "Brutalist raw"],
    ["26", "26-swiss-warm.html",    "Swiss grid, but warm"],
    ["30", "30-bauhaus.html",       "Bauhaus workshop"],
    ["6yobedbf", "seed-6yobedbf.html", "Cedar red · blueprint drawings · rotated spine · Bebas Neue"],
    ["6she6g4q", "seed-6she6g4q.html", "Cedar red · full-bleed hero · split screen · Archivo Expanded"],
    ["92wkiowx", "seed-92wkiowx.html", "Mahogany · halftone · index table · DM Serif Display"],
    ["uqqp8r38", "seed-uqqp8r38.html", "Ash grey · blueprint drawings · split screen · Unbounded"],
    ["jc0rlr3e", "seed-jc0rlr3e.html", "Whitewashed oak · full-bleed hero · newspaper columns · Unbounded"],
    ["7nxgi4xc", "seed-7nxgi4xc.html", "Charred oak · square crops · rotated spine · Fraunces"],
    ["wu3ikcf7", "seed-wu3ikcf7.html", "Cedar red · halftone · 4-col modules · Instrument Serif"],
    ["92u4lbxs", "seed-92u4lbxs.html", "Mahogany · halftone · 4-col modules · Fraunces"],
  ];
  for (const [n, file, name] of variants) {
    document.body.insertAdjacentHTML("beforeend",
      `<section class="variant"><div class="label"><b>#${n}</b><span>${name}</span><a href="${file}" target="_blank">open ↗</a></div><iframe src="${file}" loading="lazy"></iframe></section>`);
  }
</script>
</body>
</html>
