<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AstroHout – Hout op maat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F4EDE2;
    --ink: #1E1A17;
    --red: #D2381E;
    --cedar: #A9663C;
    --margin: 40px;
    --mark: 28px; /* 12px outside the content box */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--ink); overflow-x: hidden; }
  body {
    font-family: 'Archivo', system-ui, sans-serif;
    font-weight: 400; font-stretch: 100%;
    font-size: 15px; line-height: 20px;
  }
  a { color: inherit; text-decoration: none; }

  .header {
    position: relative;
    height: 100vh; height: 100svh; min-height: 560px;
    display: grid;
    grid-template-columns: 1fr 1fr;      /* hard 50/50 split, no gutter */
    overflow: hidden;
  }

  /* LEFT: solid accent block */
  .block {
    background: var(--red);
    position: relative;
    padding: var(--margin);
    display: flex; flex-direction: column; justify-content: space-between;
    min-width: 0;
  }
  .brand {
    display: flex; align-items: center; gap: 12px;   /* logo 40px, 12px gap */
    color: var(--bg);
    font-weight: 800; font-stretch: 125%;
    text-transform: uppercase; letter-spacing: .01em;
    font-size: 15px; line-height: 40px;
  }
  .brand img { height: 40px; width: auto; display: block; filter: invert(1); }

  h1 {
    font-weight: 800; font-stretch: 125%;
    text-transform: uppercase;
    font-size: clamp(80px, 11.3vw, 220px); /* spec 14vw would spill out of the 50% block with the expanded width */
    line-height: .9; letter-spacing: -.03em;
    color: var(--ink);
    margin: 0 0 0 -.04em;
    white-space: nowrap;
  }
  h1 span { display: block; }
  h1 .op { color: var(--bg); }

  .foot { width: 33%; min-width: 250px; display: flex; flex-direction: column; gap: 14px; color: var(--bg); }
  .foot p { max-width: 30ch; }
  nav { display: flex; gap: 20px; }
  nav a { border-bottom: 1px solid transparent; padding-bottom: 1px; }
  nav a:hover { border-bottom-color: var(--bg); }
  .cta {
    align-self: flex-start;
    background: var(--ink); color: var(--bg);
    padding: 10px 16px; font-weight: 400;
  }
  .cta:hover { background: var(--bg); color: var(--ink); }
  .seed { font-size: 11px; line-height: 14px; letter-spacing: .06em; text-transform: uppercase; opacity: .85; }

  /* RIGHT: imagery, full half height */
  .photos {
    display: grid; grid-template-columns: 3fr 2fr; grid-template-rows: 1fr 1fr;
    min-width: 0; min-height: 0;
  }
  .photos img { width: 100%; height: 100%; object-fit: cover; display: block; min-width: 0; min-height: 0; }
  .photos .big { grid-row: 1 / 3; }

  /* Registration marks */
  .mark { position: absolute; width: 14px; height: 14px; pointer-events: none; z-index: 3;
          filter: drop-shadow(0 0 1px var(--bg)) drop-shadow(0 0 1px var(--bg)); }
  .mark::before, .mark::after { content: ""; position: absolute; background: var(--ink); }
  .mark::before { width: 14px; height: 1px; }
  .mark::after  { width: 1px; height: 14px; }
  .tl { top: var(--mark); left: var(--mark); }
  .tr { top: var(--mark); right: var(--mark); transform: scaleX(-1); }
  .bl { bottom: var(--mark); left: var(--mark); transform: scaleY(-1); }
  .br { bottom: var(--mark); right: var(--mark); transform: scale(-1, -1); }
  .cross { position: absolute; top: var(--mark); left: 50%; width: 15px; height: 15px; margin: -7px 0 0 -7px; z-index: 3;
           pointer-events: none; filter: drop-shadow(0 0 1px var(--bg)) drop-shadow(0 0 1px var(--bg)); }
  .cross::before, .cross::after { content: ""; position: absolute; background: var(--ink); }
  .cross::before { left: 7px; top: 0; width: 1px; height: 15px; }
  .cross::after  { top: 7px; left: 0; height: 1px; width: 15px; }
  .cross i { position: absolute; left: 3px; top: 3px; width: 9px; height: 9px; border: 1px solid var(--ink); border-radius: 50%; }

  @media (max-width: 760px) {
    :root { --margin: 28px; --mark: 14px; }
    .header { grid-template-columns: 1fr; grid-template-rows: 62% 38%; }
    .block { padding: var(--margin); }
    .foot { width: 100%; min-width: 0; gap: 10px; }
    .foot p { display: none; }
    .photos { grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr; }
    .photos .big { grid-row: auto; }
    .cross { display: none; }
    h1 { font-size: 80px; }
    nav { gap: 16px; }
  }
  @media (max-width: 760px) and (max-height: 640px) {
    h1 { font-size: 64px; }
  }
</style>
</head>
<body>
<header class="header">
  <div class="block">
    <a class="brand" href="#" aria-label="AstroHout">
      <img src="../logo/base-logo.svg" alt="">
      <span>AstroHout</span>
    </a>

    <h1><span>Hout</span><span class="op">op</span><span>maat</span></h1>

    <div class="foot">
      <p>Meubels en houtwerk, met de hand gemaakt in een eenmanswerkplaats in Nederland.</p>
      <nav aria-label="Hoofdmenu">
        <a href="#werk">Werk</a>
        <a href="#over">Over</a>
        <a href="#contact">Contact</a>
      </nav>
      <a class="cta" href="#contact">Vraag een offerte &rarr;</a>
      <div class="seed">Seed 6she6g4q</div>
    </div>
  </div>

  <div class="photos">
    <img class="big" src="../portfolio/bed2.jpg" alt="Handgemaakt houten bed">
    <img src="../portfolio/borrelplank1.jpg" alt="Houten borrelplank">
    <img src="../portfolio/single_room1.jpg" alt="Houten inrichting voor een slaapkamer">
  </div>

  <span class="mark tl"></span><span class="mark tr"></span>
  <span class="mark bl"></span><span class="mark br"></span>
  <span class="cross"><i></i></span>
</header>
</body>
</html>
