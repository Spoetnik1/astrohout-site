<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AstroHout — Meubels op maat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --oak:#EFE6D8;        /* oiled oak ground */
    --oak-deep:#E4D8C5;   /* guide tint */
    --walnut:#2B1D14;     /* text */
    --walnut-soft:#6B5848;
    --teak:#C9A27A;       /* mid-tone block */
    --accent:#C8560A;     /* burnt orange */
    --rule:#2B1D14;
    --gut:16px;
    --gap:8px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:var(--oak);color:var(--walnut);
    font-family:'Archivo',sans-serif;-webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  a{color:inherit;text-decoration:none;}
  img{display:block;}

  .stage{
    position:relative;height:100vh;height:100svh;
    padding:12px var(--gut) var(--gut);
    display:grid;grid-template-rows:auto auto 1fr;
    row-gap:12px;
  }
  .g{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--gap);}

  /* faint column guides */
  .guides{position:absolute;inset:0 var(--gut);pointer-events:none;}
  .guides span{background:rgba(43,29,20,.035);border-inline:1px solid rgba(43,29,20,.06);}

  /* header */
  .top{position:relative;align-items:center;padding-bottom:12px;border-bottom:2px solid var(--rule);}
  .brand{grid-column:1/-1;display:flex;align-items:center;gap:10px;}
  .brand img{height:38px;width:auto;aspect-ratio:1000/1335;}
  .brand b{font-weight:800;font-size:20px;letter-spacing:-.03em;}
  .nav{display:contents;}
  .nav a{font-size:12px;font-weight:600;letter-spacing:.01em;display:flex;gap:6px;align-items:baseline;}
  .nav a i{font-style:normal;color:var(--accent);font-weight:800;font-size:10px;}
  .nav a:hover{color:var(--accent);}
  .navbar{position:relative;display:flex;justify-content:space-between;padding-bottom:10px;border-bottom:1px solid var(--rule);}
  .top .nav{display:none;}
  .cta-top{display:none;}

  /* hero */
  .hero{position:relative;min-height:0;grid-template-rows:auto 1fr 1fr;row-gap:var(--gap);}
  h1{
    grid-column:1/-1;grid-row:1;
    font-weight:900;text-transform:none;
    font-size:min(15.2vw,14.5svh);
    line-height:.88;letter-spacing:-.045em;
    padding-top:4px;
  }
  h1 em{font-style:normal;color:var(--accent);}
  h1 span{display:block;}

  .ph{position:relative;overflow:hidden;background:var(--teak);min-height:0;}
  .ph img{width:100%;height:100%;object-fit:cover;filter:sepia(.18) saturate(.95) contrast(1.02);}
  .ph figcaption{
    position:absolute;left:0;bottom:0;background:var(--oak);color:var(--walnut);
    font-size:10px;font-weight:600;padding:4px 7px 3px 0;padding-left:6px;
    display:flex;gap:6px;letter-spacing:.02em;
  }
  .ph figcaption i{font-style:normal;color:var(--accent);font-weight:800;}

  /* mobile placement */
  .p-bed{grid-column:1/8;grid-row:2/4;}
  .p-hek{grid-column:8/13;grid-row:2;}
  .p-bor{grid-column:8/13;grid-row:3;}
  .tag{
    grid-column:1/-1;grid-row:4;margin-top:4px;
    display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--gap);align-items:end;
  }
  .tag p{grid-column:1/8;font-size:15px;font-weight:600;line-height:1.25;letter-spacing:-.01em;}
  .tag small{grid-column:8/13;font-size:10px;line-height:1.35;color:var(--walnut-soft);font-weight:500;}
  .tag small b{display:block;color:var(--accent);font-weight:800;font-size:9px;letter-spacing:.06em;text-transform:uppercase;}
  .cta{
    grid-column:1/-1;grid-row:5;margin-top:4px;
    background:var(--accent);color:var(--oak);
    display:flex;justify-content:space-between;align-items:center;
    padding:14px 14px;font-weight:800;font-size:17px;letter-spacing:-.02em;
    transition:background .2s;
  }
  .cta:hover{background:var(--walnut);}
  .cta svg{width:22px;height:22px;flex:none;}
  .hero{grid-template-rows:auto minmax(110px,1fr) minmax(110px,1fr) auto auto;}

  /* desktop */
  @media(min-width:900px){
    :root{--gut:32px;--gap:16px;}
    .stage{padding-top:20px;row-gap:0;grid-template-rows:auto 1fr;}
    .navbar{display:none;}
    .top{padding-bottom:16px;}
    .brand{grid-column:1/5;}
    .brand img{height:50px;}
    .brand b{font-size:26px;}
    .top .nav{display:contents;}
    .top .nav a{font-size:13px;}
    .top .nav a:nth-child(1){grid-column:5/7;}
    .top .nav a:nth-child(2){grid-column:7/9;}
    .top .nav a:nth-child(3){grid-column:9/10;}
    .top .nav a:nth-child(4){grid-column:10/11;}
    .cta-top{display:block;grid-column:11/13;justify-self:end;font-size:11px;font-weight:600;color:var(--walnut-soft);text-align:right;line-height:1.3;}
    .hero{margin-top:var(--gap);grid-template-rows:repeat(6,minmax(0,1fr));row-gap:var(--gap);}
    h1{grid-column:1/9;grid-row:1/4;font-size:min(9.4vw,18.5svh);line-height:.86;padding-top:0;margin-top:-.04em;}
    .p-bed{grid-column:9/13;grid-row:1/6;}
    .p-hek{grid-column:7/9;grid-row:4/7;}
    .p-bor{grid-column:5/7;grid-row:4/7;}
    .tag{
      grid-column:1/5;grid-row:4/7;margin:0;
      display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;
      background:var(--teak);padding:14px 16px 16px;
    }
    .tag p{font-size:clamp(18px,1.9vw,26px);font-weight:800;letter-spacing:-.025em;line-height:1.08;}
    .tag p,.tag small{grid-column:auto;}
    .tag small{font-size:11px;line-height:1.45;color:var(--walnut);max-width:30ch;}
    .tag small b{display:block;color:var(--accent);font-weight:800;margin-bottom:3px;font-size:10px;letter-spacing:.06em;text-transform:uppercase;}
    .cta{
      grid-column:9/13;grid-row:6/7;margin:0;
      font-size:clamp(17px,1.7vw,24px);padding:0 18px;
    }
    .cta svg{width:30px;height:30px;}
    .ph figcaption{font-size:11px;padding:5px 9px 4px 0;}
  }
  @media(min-width:900px) and (max-height:640px){
    h1{font-size:min(9vw,17svh);}
  }
  @media(max-width:380px){
    .brand img{height:34px;}
    .brand b{font-size:18px;}
    .nav a{font-size:11px;}
  }
</style>
</head>
<body>
<div class="stage">
  <div class="guides g" aria-hidden="true">
    <span></span><span></span><span></span><span></span><span></span><span></span>
    <span></span><span></span><span></span><span></span><span></span><span></span>
  </div>

  <header class="top g">
    <a class="brand" href="#"><img src="../logo/base-logo.svg" alt=""><b>AstroHout</b></a>
    <nav class="nav" aria-label="Hoofdmenu">
      <a href="#"><i>01</i>Werk</a>
      <a href="#"><i>02</i>Werkwijze</a>
      <a href="#"><i>03</i>Over</a>
      <a href="#"><i>04</i>Contact</a>
    </nav>
    <span class="cta-top">Eén maker,<br>van schets tot afwerking</span>
  </header>

  <nav class="navbar nav" aria-label="Hoofdmenu mobiel">
    <a href="#"><i>01</i>Werk</a>
    <a href="#"><i>02</i>Werkwijze</a>
    <a href="#"><i>03</i>Over</a>
    <a href="#"><i>04</i>Contact</a>
  </nav>

  <main class="hero g">
    <h1><span>Meubels</span><span>op maat,</span><span><em>met de hand</em></span></h1>

    <figure class="ph p-bed"><img src="../portfolio/bed5.jpg" alt="Handgemaakt houten bed"><figcaption><i>02</i>Bed</figcaption></figure>
    <figure class="ph p-hek"><img src="../portfolio/hek2.jpg" alt="Houten tuinhek"><figcaption><i>03</i>Hek</figcaption></figure>
    <figure class="ph p-bor"><img src="../portfolio/borrelplank1.jpg" alt="Houten borrelplank"><figcaption><i>01</i>Borrelplank</figcaption></figure>

    <div class="tag">
      <p>Meubels op maat, met de hand gemaakt.</p>
      <small><b>Werkplaats</b>Ontwerp, bouw en afwerking door één maker. Hout dat eerlijk veroudert.</small>
    </div>

    <a class="cta" href="#">Vraag een ontwerp aan
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square"><path d="M5 19L19 5M8 5h11v11"/></svg>
    </a>
  </main>
</div>
</body>
</html>
