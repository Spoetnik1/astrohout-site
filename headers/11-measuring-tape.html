<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AstroHout – Meubels op maat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&family=Archivo+Black&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#121212;
  --paper:#f3efe4;
  --yellow:#ffc61a;
  --red:#e2342b;
  --steel:#c8ccd0;
  --tape:48px;
  --gut:16px;
  --H:min(calc((100vw - 90px) / 1.934), 26svh); /* height of tallest photo */
  --font-display:"Archivo Black","Archivo",system-ui,sans-serif;
  --font-body:"Archivo",system-ui,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  height:100vh;height:100svh;overflow:hidden;
  display:flex;flex-direction:column;
  background:var(--ink);color:var(--paper);
  font-family:var(--font-body);
}

/* ---------- TAPE ---------- */
.tape{position:relative;height:var(--tape);background:var(--yellow);border-bottom:3px solid #000;flex:none;z-index:2}
.ticks{
  position:absolute;inset:0;
  background:
    linear-gradient(90deg,var(--ink) 2px,transparent 2px) 0 0/10% 100% repeat-x,
    linear-gradient(90deg,var(--ink) 1.5px,transparent 1.5px) 0 0/5% 58% repeat-x,
    linear-gradient(90deg,var(--ink) 1px,transparent 1px) 0 0/1% 32% repeat-x;
  animation:pull 1s cubic-bezier(.2,.8,.2,1) both;
}
.ticks i{
  position:absolute;left:calc(var(--n) * 1%);bottom:4px;margin-left:5px;
  font:700 12px/1 var(--font-mono);color:var(--ink);font-style:normal;
}
.unit{position:absolute;right:var(--gut);top:8px;font:700 10px/1 var(--font-mono);color:var(--ink);letter-spacing:.12em;display:none}
@keyframes pull{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}

/* hook = scroll progress */
.hook{
  position:absolute;top:0;left:calc(var(--p,0) * (100% - 14px));
  width:14px;height:calc(var(--tape) + 3px + 12px);
  background:linear-gradient(90deg,#9aa0a6,var(--steel) 40%,#8a9097);
  border:2px solid #000;border-top:0;z-index:3;
}
.hook::after{content:"";position:absolute;left:-2px;right:-2px;bottom:-2px;height:5px;background:var(--red);border:2px solid #000}

/* ---------- NAV (pointers on the rule) ---------- */
.nav{position:relative;flex:none;height:58px;z-index:2}
.nav a{
  position:absolute;left:calc(var(--at) * 1%);top:0;transform:translateX(-50%);
  padding-top:15px;text-align:center;white-space:nowrap;text-decoration:none;
  color:var(--paper);font:700 12px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;
}
.nav a::before{ /* pointer line crossing the tape */
  content:"";position:absolute;left:50%;bottom:100%;width:2px;margin-left:-1px;
  height:calc(var(--tape) + 3px);background:var(--red);
}
.nav a::after{ /* arrow head */
  content:"";position:absolute;left:50%;top:0;width:12px;height:10px;margin-left:-6px;
  background:var(--red);clip-path:polygon(50% 0,0 100%,100% 100%);
}
.nav small{display:block;margin-top:5px;font:500 10px/1 var(--font-mono);color:var(--yellow);letter-spacing:.06em}
.nav a:hover,.nav a:focus-visible{color:var(--yellow);outline:0}
.nav a:hover::before,.nav a:focus-visible::before{width:4px;margin-left:-2px}

/* ---------- LEFT RULE (desktop) ---------- */
.lr{display:none}

/* ---------- HERO ---------- */
.hero{
  flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-evenly;
  padding:0 var(--gut) 10px;gap:8px;
}
.brand{display:inline-flex;align-items:center;gap:10px;color:var(--paper);text-decoration:none;font:400 22px/1 var(--font-display);letter-spacing:.01em;align-self:flex-start}
.brand img{height:44px;width:auto;filter:invert(1);display:block}
h1{
  margin:0;font:400 min(10.5vw,7.4svh)/1.02 var(--font-display);letter-spacing:-.01em;text-transform:none;
}
h1 mark{background:var(--yellow);color:var(--ink);padding:0 .12em;margin:0 -.04em}
.lede{margin:0;font-size:clamp(16px,1.5vw,21px);line-height:1.35;max-width:30ch;color:rgba(243,239,228,.85)}
.cta{
  align-self:flex-start;position:relative;display:inline-flex;align-items:center;gap:12px;
  padding:14px 20px 18px;background:var(--yellow);color:var(--ink);text-decoration:none;
  font:700 15px/1 var(--font-body);letter-spacing:.02em;
  background-image:repeating-linear-gradient(90deg,var(--ink) 0 1px,transparent 1px 6px);
  background-size:100% 6px;background-repeat:no-repeat;background-position:0 100%;
  background-color:var(--yellow);transition:background-color .15s,color .15s;
}
.cta span{font-family:var(--font-mono)}
.cta:hover,.cta:focus-visible{background-color:var(--red);color:#fff;outline:0}

/* ---------- PHOTO SET WITH DIMENSION LINES ---------- */
.set{display:flex;align-items:flex-end;gap:8px;--dim:var(--paper)}
.set figure{margin:0;width:calc(var(--H) * var(--k) * .75)}
.set img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;background:#2a2a2a}
.set .ph{position:relative}
.tag{position:absolute;left:0;top:0;background:var(--yellow);color:var(--ink);font:700 10px/1 var(--font-mono);padding:4px 6px}

.dim{position:relative;color:var(--yellow);font:500 10px/1 var(--font-mono);letter-spacing:.04em}
.dim span{position:absolute;background:var(--ink);padding:0 5px;white-space:nowrap}
.dim.h{height:18px;margin-top:10px;
  background:
    linear-gradient(var(--dim),var(--dim)) 0 50%/100% 1px no-repeat,
    linear-gradient(var(--dim),var(--dim)) 0 0/1px 100% no-repeat,
    linear-gradient(var(--dim),var(--dim)) 100% 0/1px 100% no-repeat;
}
.dim.h span{left:50%;top:50%;transform:translate(-50%,-50%)}
.dim.h::before,.dim.h::after,.dim.v::before,.dim.v::after{content:"";position:absolute;background:var(--dim)}
.dim.h::before,.dim.h::after{top:50%;width:9px;height:7px;margin-top:-3.5px}
.dim.h::before{left:0;clip-path:polygon(100% 0,0 50%,100% 100%)}
.dim.h::after{right:0;clip-path:polygon(0 0,100% 50%,0 100%)}
.dim.v{width:18px;height:var(--H);margin-left:6px;align-self:flex-start;
  background:
    linear-gradient(var(--dim),var(--dim)) 50% 0/100% 1px no-repeat,
    linear-gradient(var(--dim),var(--dim)) 50% 100%/100% 1px no-repeat,
    linear-gradient(var(--dim),var(--dim)) 50% 0/1px 100% no-repeat;
}
.dim.v span{left:50%;top:50%;transform:translate(-50%,-50%) rotate(-90deg)}
.dim.v::before,.dim.v::after{left:50%;width:7px;height:9px;margin-left:-3.5px}
.dim.v::before{top:0;clip-path:polygon(0 100%,50% 0,100% 100%)}
.dim.v::after{bottom:0;clip-path:polygon(0 0,100% 0,50% 100%)}

/* ---------- ≥ 700px ---------- */
@media (min-width:700px){
  :root{--tape:60px;--gut:32px}
  .ticks{background:
    linear-gradient(90deg,var(--ink) 2px,transparent 2px) 0 0/10% 100% repeat-x,
    linear-gradient(90deg,var(--ink) 1.5px,transparent 1.5px) 0 0/5% 58% repeat-x,
    linear-gradient(90deg,var(--ink) 1px,transparent 1px) 0 0/1% 34% repeat-x,
    linear-gradient(90deg,var(--ink) 1px,transparent 1px) 0 0/.5% 18% repeat-x}
  .ticks i{font-size:14px;bottom:6px}
  .unit{display:block}
  .nav a{font-size:15px}
  .nav small{font-size:11px}
  .dim{font-size:12px}
  .tag{font-size:12px;padding:5px 8px}
  .set{gap:18px}
  .dim.v{margin-left:10px}
}

/* ---------- ≥ 900px : two columns + left rule ---------- */
@media (min-width:900px){
  :root{--H:min(54svh,22vw)}
  .lr{
    display:block;position:absolute;left:0;top:calc(var(--tape) + 3px);bottom:0;width:26px;background:var(--yellow);border-right:3px solid #000;z-index:1;
    background-image:
      linear-gradient(180deg,var(--ink) 2px,transparent 2px),
      linear-gradient(180deg,var(--ink) 1.5px,transparent 1.5px),
      linear-gradient(180deg,var(--ink) 1px,transparent 1px);
    background-size:100% 120px,16px 60px,9px 12px;background-repeat:repeat-y;background-position:0 0;
  }
  .hero{flex-direction:row;align-items:center;justify-content:space-between;gap:40px;padding:0 var(--gut) 24px 78px}
  .copy{display:flex;flex-direction:column;gap:clamp(14px,3.2svh,32px);align-items:flex-start;min-width:0}
  h1{font-size:min(5.2vw,10.5svh)}
  .brand img{height:58px}
  .brand{font-size:26px}
}
@media (min-width:900px) and (max-height:620px){.brand img{height:40px}}
@media (prefers-reduced-motion:reduce){.ticks{animation:none}}
</style>
</head>
<body>

<header>
  <div class="tape" aria-hidden="true">
    <div class="ticks">
      <i style="--n:0">0</i><i style="--n:10">10</i><i style="--n:20">20</i><i style="--n:30">30</i><i style="--n:40">40</i><i style="--n:50">50</i><i style="--n:60">60</i><i style="--n:70">70</i><i style="--n:80">80</i><i style="--n:90">90</i>
    </div>
    <span class="unit">CM</span>
    <span class="hook"></span>
  </div>
  <nav class="nav" aria-label="Hoofdmenu">
    <a href="#werk" style="--at:20">Werk<small>20 cm</small></a>
    <a href="#werkwijze" style="--at:40">Werkwijze<small>40 cm</small></a>
    <a href="#over" style="--at:60">Over<small>60 cm</small></a>
    <a href="#contact" style="--at:80">Contact<small>80 cm</small></a>
  </nav>
</header>

<div class="lr" aria-hidden="true"></div>

<main class="hero">
  <div class="copy">
    <a class="brand" href="#" aria-label="AstroHout"><img src="../logo/base-logo.svg" alt=""><span>AstroHout</span></a>
    <h1>Twee keer<br><mark>meten</mark>, één<br>keer zagen.</h1>
    <p class="lede">Meubels op maat, met de hand gemaakt.</p>
    <a class="cta" href="#contact">Vraag een ontwerp aan <span aria-hidden="true">&rarr;</span></a>
  </div>

  <div class="set" role="group" aria-label="Drie werkstukken, gemeten">
    <figure style="--k:.731">
      <div class="ph"><img src="../portfolio/borrelplank1.jpg" alt="Borrelplank"><span class="tag">A</span></div>
      <div class="dim h"><span>380 mm</span></div>
    </figure>
    <figure style="--k:1">
      <div class="ph"><img src="../portfolio/bed5.jpg" alt="Houten bed"><span class="tag">B</span></div>
      <div class="dim h"><span>520 mm</span></div>
    </figure>
    <figure style="--k:.847">
      <div class="ph"><img src="../portfolio/hek2.jpg" alt="Houten hek"><span class="tag">C</span></div>
      <div class="dim h"><span>440 mm</span></div>
    </figure>
    <div class="dim v" aria-hidden="true"><span>693 mm</span></div>
  </div>
</main>

<script>
(function(){
  var h=document.querySelector('.hook');
  function u(){var m=document.documentElement.scrollHeight-innerHeight;h.style.setProperty('--p',m>0?Math.min(1,scrollY/m):0)}
  addEventListener('scroll',u,{passive:true});u();
})();
</script>
</body>
</html>
